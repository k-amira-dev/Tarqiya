# Local PostgreSQL 16 with the pgvector extension. Data stays on this machine (privacy decision).
#   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: promoflow-db
    environment:
      POSTGRES_USER: promoflow
      POSTGRES_PASSWORD: promoflow
      POSTGRES_DB: promoflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promoflow"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
