# Local PostgreSQL 16 with pgvector, plus pgAdmin to browse it. Data stays on this machine (privacy decision).
#   docker compose up -d        then open http://localhost:5050 for pgAdmin
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: promoflow-db
    restart: unless-stopped  # starts automatically whenever Docker Desktop starts
    environment:
      POSTGRES_USER: promoflow
      POSTGRES_PASSWORD: promoflow
      POSTGRES_DB: promoflow
    ports:
      - "127.0.0.1:5432:5432"  # this laptop only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promoflow"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: promoflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: promoflow
      # Development only: open pgAdmin without its own login and without a master password.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"  # this laptop only: pgAdmin has no login in this setup
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
