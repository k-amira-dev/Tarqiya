[project]
name = "promoflow"
version = "0.1.0"
description = "Multi-agent decision-support system for faculty promotion review"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "streamlit>=1.42",
    "python-dotenv>=1.0",
    "pycountry>=24.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promoflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
